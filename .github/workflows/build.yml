name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Ensure debug.keystore exists
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK with Gradle
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log || {
            grep -E "^e: |error:|What went wrong|Execution failed|^> " build.log | head -60 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          }

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
